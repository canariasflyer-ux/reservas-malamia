<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservas Malamia</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap"><div id="app"><p class="cargando">Cargando…</p></div></div>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/shared.js"></script>
<script>
(function () {
'use strict';
var app = document.getElementById('app');
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var fmt0 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
var fmt2 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
var eur = function (n) { n = Number(n) || 0; return Number.isInteger(n) ? fmt0.format(n) : fmt2.format(n); };
var parseISO = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); };
var pad = function (n) { return String(n).padStart(2, '0'); };
var fechaLarga = function (s) { return parseISO(s).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }); };
var tel = function (s) { var d = String(s || '').replace(/\D/g, ''); if (d.indexOf('00') === 0) d = d.slice(2); if (d.length === 9) d = '34' + d; return d; };
var tt;
function toast(m) { var t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 3600); }
function token() {
  try { var t = sessionStorage.getItem('mm_tok'); if (t) return t; t = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); sessionStorage.setItem('mm_tok', t); return t; }
  catch (e) { return window.__tok || (window.__tok = String(Math.random()).slice(2) + Date.now()); }
}
var TOKEN = token();
function api(path, opt) {
  opt = opt || {};
  return fetch(path, { method: opt.method || 'GET', headers: opt.body ? { 'Content-Type': 'application/json' } : undefined, body: opt.body ? JSON.stringify(opt.body) : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Error'); e.status = r.status; e.data = j; throw e; } return j; }); });
}

/* ---------- estado ---------- */
var hoyD = new Date();
var E = {
  cfg: null, fecha: '', editFecha: true, mes: { y: hoyD.getFullYear(), m: hoyD.getMonth() },
  etapa: 'fecha', modo: null, mesas: [], bot: {}, ref: {}, shi: {}, cantidad: 1,
  nombre: '', telefono: '', archivos: [], disp: { ocupadas: [], retenidas: [], propias: [] },
  sheet: null, enviando: false, resultado: null, errorEnvio: ''
};
var MAXARCH = 3;

function cfgCalc() { return { ajustes: E.cfg.ajustes, articulos: E.cfg.articulos, minimos: E.cfg.minimos || {} }; }
function pedido() {
  return E.modo === 'entrada' ? { tipo: 'entrada', fecha: E.fecha, cantidad: E.cantidad }
    : { tipo: 'reservado', fecha: E.fecha, mesas: E.mesas, botellas: E.bot, refrescos: E.ref, shishas: E.shi };
}
function calc() { return Shared.calcular(cfgCalc(), pedido()); }
function minDe(id) { return (E.cfg.minimos && E.cfg.minimos[id]) || Shared.mesaPorId(id).min; }
function maxDe(id) { return (E.cfg.maximos && E.cfg.maximos[id]) || minDe(id) * 2; }
function botMinMesa(personas) { return Math.max(1, Math.ceil(personas / E.cfg.ajustes.personasPorBotella)); }

/* ---------- carga ---------- */
function cargar(fecha) {
  return api('/api/publico' + (fecha ? '?fecha=' + encodeURIComponent(fecha) : '')).then(function (c) { E.cfg = c; });
}

/* ---------- vistas ---------- */
function cabecera() {
  return '<header class="cab"><img class="logo" src="/logo.png" alt="Malamia"><h1>Reservas Malamia</h1></header>';
}
function pasosHtml() {
  if (!E.fecha || E.etapa === 'enviado') return '';
  var lista = E.modo === 'entrada' ? [['opciones', 'Fecha'], ['pago', 'Pago']] : [['opciones', 'Fecha'], ['plano', 'Mesas'], ['botellas', 'Botellas'], ['pago', 'Pago']];
  var idx = lista.map(function (x) { return x[0]; }).indexOf(E.etapa);
  return '<div class="pasos">' + lista.map(function (x, i) { return '<span class="paso ' + (i === idx ? 'on' : i < idx ? 'hecho' : '') + '">' + x[1] + '</span>'; }).join('') + '</div>';
}

function seccionFecha() {
  if (E.fecha && !E.editFecha) {
    return '<section class="card"><div class="fecha-chip"><div><div class="hint">Fecha del evento</div><b>' + esc(fechaLarga(E.fecha)) + '</b></div>' +
      (E.etapa === 'pago' && E.modo === 'entrada' ? '' : '<button class="btn sm" type="button" data-a="cambiar-fecha">Cambiar</button>') + '</div></section>';
  }
  var y = E.mes.y, m = E.mes.m, hoy = E.cfg.hoy, d0 = parseISO(hoy);
  var esMin = y === d0.getFullYear() && m === d0.getMonth();
  var tope = new Date(d0.getFullYear(), d0.getMonth() + 12, 1);
  var esMax = y === tope.getFullYear() && m === tope.getMonth();
  var off = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  var h = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(function (d) { return '<div class="wd">' + d + '</div>'; }).join('');
  for (var i = 0; i < off; i++) h += '<div class="vac"></div>';
  for (var d = 1; d <= n; d++) {
    var f = y + '-' + pad(m + 1) + '-' + pad(d);
    var ok = f >= hoy && Shared.diaAbierto(E.cfg.dias, f);
    h += '<button type="button" ' + (ok ? 'class="abierto' + (f === E.fecha ? ' sel' : '') + '" data-a="dia" data-f="' + f + '" aria-label="' + esc(fechaLarga(f)) + '"' : 'disabled tabindex="-1" aria-label="' + esc(fechaLarga(f)) + ' no disponible"') + '>' + d + '</button>';
  }
  return '<section class="card"><h2>Fecha del evento</h2><p class="hint">Elige uno de los días marcados.</p>' +
    '<div class="cal-nav"><button class="btn" type="button" data-a="mes" data-d="-1" aria-label="Mes anterior"' + (esMin ? ' disabled' : '') + '>‹</button>' +
    '<h2>' + esc(new Date(y, m, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })) + '</h2>' +
    '<button class="btn" type="button" data-a="mes" data-d="1" aria-label="Mes siguiente"' + (esMax ? ' disabled' : '') + '>›</button></div>' +
    '<div class="cal">' + h + '</div></section>';
}

function seccionOpciones() {
  var A = E.cfg.ajustes;
  return '<div class="stack">' +
    '<button class="opcion amarilla" type="button" data-a="modo-entrada"><b>' + esc(A.entradaTitulo) + ' ' + eur(A.entradaPrecio) + '</b>' + (A.entradaDesc ? '<span>(' + esc(A.entradaDesc) + ')</span>' : '') + '</button>' +
    '<button class="opcion rosa" type="button" data-a="modo-reservado"><b>PIDE TU RESERVADO</b><span>Elige tu mesa en el plano de la discoteca</span></button></div>';
}

/* ----- plano ----- */
function estadoMesa(id) {
  if (E.mesas.some(function (x) { return x.id === id; })) return 'propia';
  if (E.disp.ocupadas.indexOf(id) > -1) return 'ocupada';
  if (E.disp.retenidas.indexOf(id) > -1) return 'retenida';
  return 'libre';
}
function svgMesas() {
  return Shared.MESAS.map(function (t) {
    var st = estadoMesa(t.id), nombre = Shared.nombreMesa(t.id);
    var et = { libre: 'libre', ocupada: 'ocupada', retenida: 'alguien la está reservando ahora, puedes pedirla igualmente', propia: 'seleccionada' }[st];
    var txt = st === 'ocupada' ? '✕' : st === 'retenida' ? '…' : st === 'propia' ? '✓' : t.num;
    var puls = st !== 'ocupada';
    return '<g class="mesa ' + st + '"' + (puls ? ' role="button" tabindex="0" data-a="mesa" data-id="' + t.id + '"' : '') + ' aria-label="' + esc(nombre + ', ' + et) + '">' +
      '<rect x="' + (t.x - t.w / 2) + '" y="' + (t.y - t.h / 2) + '" width="' + t.w + '" height="' + t.h + '" rx="7"/>' +
      '<text x="' + t.x + '" y="' + (t.y + 5.5) + '">' + txt + '</text></g>';
  }).join('');
}
function listaMesasSel() {
  if (!E.mesas.length) return '<p class="hint">Aún no has elegido ninguna mesa. Pulsa una mesa verde del plano.</p>';
  return '<div class="lista">' + E.mesas.map(function (x) {
    return '<div class="sel-mesa"><div><b>' + esc(Shared.nombreMesa(x.id)) + '</b><div class="hint">' + x.personas + ' personas · mínimo ' + botMinMesa(x.personas) + (botMinMesa(x.personas) === 1 ? ' botella' : ' botellas') + '</div></div>' +
      '<div class="acc"><button class="btn sm" type="button" data-a="mesa" data-id="' + x.id + '">Editar</button><button class="btn sm danger" type="button" data-a="quitar-mesa" data-id="' + x.id + '">Quitar</button></div></div>';
  }).join('') + '</div>';
}
function vistaPlano() {
  var c = calc();
  var nb = E.mesas.reduce(function (t, x) { return t + botMinMesa(x.personas); }, 0);
  return '<div class="stack"><button class="volver" type="button" data-a="a-opciones">← Volver</button>' +
    '<section class="card plano-card"><div style="padding:6px 6px 0"><h2>Elige tu mesa</h2><p class="hint">Cada mesa lleva como mínimo una botella (1 botella cada 5 personas). Puedes reservar varias mesas. Si una mesa está en amarillo, otra persona la está reservando ahora, pero puedes pedirla igualmente: se la queda quien envíe antes la reserva con el comprobante de pago.</p></div>' +
    '<div class="plano"><img src="/plano.png" alt="Plano de la discoteca Malamia" width="465" height="730"><svg id="svg-mesas" viewBox="0 0 465 730" aria-label="Mesas del plano">' + svgMesas() + '</svg></div>' +
    '<div class="leyenda"><span><i class="l"></i>Libre</span><span><i class="o"></i>Ocupada</span><span><i class="r"></i>La están reservando ahora</span><span><i class="p"></i>Tu selección</span></div></section>' +
    '<section class="card"><h2>Tus mesas</h2><div id="sel-mesas">' + listaMesasSel() + '</div></section>' +
    '<div class="barra"><div><div class="hint">Botellas mínimas</div><div class="t" id="barra-bot">' + nb + '</div></div>' +
    '<button class="btn primary" type="button" data-a="a-botellas" id="btn-botellas"' + (E.mesas.length ? '' : ' disabled') + '>Continuar: elegir botellas</button></div></div>';
}
function pintarPlano() {
  var s = $('#svg-mesas'); if (!s) return;
  s.innerHTML = svgMesas();
  $('#sel-mesas').innerHTML = listaMesasSel();
  var nb = E.mesas.reduce(function (t, x) { return t + botMinMesa(x.personas); }, 0);
  $('#barra-bot').textContent = nb;
  $('#btn-botellas').disabled = !E.mesas.length;
}

/* hoja para elegir personas */
function pintarSheet() {
  var h = $('#sheet');
  if (!E.sheet) { h.innerHTML = ''; return; }
  var id = E.sheet.id, p = E.sheet.personas, min = minDe(id), max = maxDe(id);
  var nb = botMinMesa(p), ya = E.mesas.some(function (x) { return x.id === id; });
  h.innerHTML = '<div class="fondo" data-a="cerrar-sheet"></div><div class="hoja" role="dialog" aria-modal="true" aria-label="Personas en la mesa"><div class="hoja-in">' +
    '<div><h3>' + esc(Shared.nombreMesa(id)) + '</h3><p class="hint">De ' + min + ' a ' + max + ' personas' + (min >= 10 ? ' (mesa doble)' : '') + '</p></div>' +
    '<div class="item"><div class="nom">Personas</div><div class="stepper"><button type="button" data-a="pers" data-d="-1" aria-label="Una persona menos"' + (p <= min ? ' disabled' : '') + '>−</button><output>' + p + '</output><button type="button" data-a="pers" data-d="1" aria-label="Una persona más"' + (p >= max ? ' disabled' : '') + '>+</button></div></div>' +
    '<p class="hint">Necesitas como mínimo <b>' + nb + (nb === 1 ? ' botella' : ' botellas') + '</b> para esta mesa.</p>' +
    '<button class="btn primary block" type="button" data-a="guardar-mesa">' + (ya ? 'Guardar cambios' : 'Añadir mesa') + '</button>' +
    '<button class="btn ghost block" type="button" data-a="cerrar-sheet">Cancelar</button></div></div>';
  var b = $('.hoja button[data-a="guardar-mesa"]'); if (b) b.focus();
}

/* retención de mesas: evita que dos personas compren la misma */
function retener() {
  if (!E.fecha || E.modo !== 'reservado') return Promise.resolve();
  return api('/api/retener', { method: 'POST', body: { fecha: E.fecha, token: TOKEN, mesas: E.mesas.map(function (x) { return x.id; }) } })
    .then(function (r) { E.disp = { ocupadas: r.ocupadas, retenidas: r.retenidas, propias: r.propias }; })
    .catch(function (e) {
      if (e.status === 409) { E.disp = { ocupadas: e.data.ocupadas || [], retenidas: e.data.retenidas || [], propias: e.data.propias || [] }; }
      throw e;
    });
}
function quitarOcupadas() {
  var antes = E.mesas.length;
  E.mesas = E.mesas.filter(function (x) { return E.disp.ocupadas.indexOf(x.id) < 0; });
  return antes - E.mesas.length;
}
function refrescarDisp() {
  if (!E.fecha || E.modo !== 'reservado') return Promise.resolve();
  return api('/api/disponibilidad?fecha=' + E.fecha + '&token=' + encodeURIComponent(TOKEN)).then(function (d) {
    E.disp = d;
    var q = quitarOcupadas();
    if (E.etapa === 'plano') { pintarPlano(); } else if (q) { toast('Una de tus mesas acaba de ser reservada por otra persona. Elige otra.'); E.etapa = 'plano'; render(); }
    if (q && E.etapa === 'plano') toast('Una de tus mesas acaba de ser reservada por otra persona.');
  }).catch(function () {});
}

/* ----- botellas ----- */
function stepperItem(lista, sel, key, extra) {
  return lista.map(function (a) {
    var q = sel[a.id] || 0;
    return '<div class="item' + (q ? ' on' : '') + '"><div class="nom"><div>' + esc(a.nombre) + '</div><div class="pre">' + extra(a) + '</div></div>' +
      '<div class="stepper" role="group" aria-label="Cantidad de ' + esc(a.nombre) + '"><button type="button" data-a="q" data-k="' + key + '" data-id="' + esc(a.id) + '" data-d="-1" aria-label="Quitar uno"' + (q ? '' : ' disabled') + '>−</button><output>' + q + '</output>' +
      '<button type="button" data-a="q" data-k="' + key + '" data-id="' + esc(a.id) + '" data-d="1" aria-label="Añadir uno">+</button></div></div>';
  }).join('');
}
function vistaBotellas() {
  var c = calc(), A = E.cfg.ajustes, X = E.cfg.articulos;
  var slots = '';
  var nombres = []; X.botellas.forEach(function (b) { for (var i = 0; i < (E.bot[b.id] || 0); i++) nombres.push(b.nombre); });
  for (var i = 0; i < Math.max(c.botellasMin, nombres.length); i++) {
    slots += '<span class="slot ' + (nombres[i] ? 'lleno' : '') + '">' + (nombres[i] ? esc(nombres[i]) : 'Botella ' + (i + 1) + ': elige una') + '</span>';
  }
  var cupo = c.refrescos ? c.refrescos.cupo : 0, usados = c.refrescos ? c.refrescos.total : 0;
  var pct = cupo ? Math.min(100, Math.round(usados * 100 / cupo)) : 0;
  return '<div class="stack"><button class="volver" type="button" data-a="a-plano">← Volver al plano</button>' +
    '<section class="card"><h2>Elige tus botellas</h2>' +
    '<p>Para tus mesas necesitas como mínimo <b>' + c.botellasMin + (c.botellasMin === 1 ? ' botella' : ' botellas') + '</b> (1 por cada ' + A.personasPorBotella + ' personas). Puedes elegir más.</p>' +
    '<div class="slots" id="slots">' + slots + '</div>' +
    '<div class="lista" id="l-bot">' + (X.botellas.length ? stepperItem(X.botellas, E.bot, 'bot', function (a) { return eur(a.precio); }) : '<p class="hint">No hay botellas disponibles.</p>') + '</div></section>' +
    '<section class="card"><h2>Refrescos</h2>' +
    '<p>Cada botella incluye <b>' + A.refrescosPorBotella + ' refrescos</b>. Para continuar elige los <b id="cupo-txt">' + cupo + '</b> que incluyen tus botellas. Aperol y Red Bull llevan un suplemento y los que pasen de los incluidos se cobran aparte.</p>' +
    '<div id="medidor"><div class="lin"><span>Refrescos incluidos elegidos</span><span>' + usados + ' / ' + cupo + '</span></div><div class="medidor"><i style="width:' + pct + '%"></i></div></div>' +
    '<div class="lista" id="l-ref">' + stepperItem(X.refrescos, E.ref, 'ref', function (a) { return (a.suplemento > 0 ? '<em>+' + eur(a.suplemento) + ' suplemento</em> · ' : '') + 'extra ' + eur(a.precio); }) + '</div></section>' +
    (X.shishas.length ? '<section class="card"><div class="titulo-sec"><h2>Shishas</h2>' + (A.mostrarNuevoShisha ? '<span class="nuevo">NUEVO</span>' : '') + '</div>' +
      '<div class="lista" id="l-shi">' + stepperItem(X.shishas, E.shi, 'shi', function (a) { return eur(a.precio); }) + '</div></section>' : '') +
    '<div class="barra"><div><div class="hint">Total</div><div class="t" id="barra-total">' + eur(c.total) + '</div></div><div class="m" id="barra-msg"></div>' +
    '<button class="btn primary" type="button" data-a="a-pago" id="btn-pago">Continuar al pago</button></div></div>';
}
function pintarBotellas() {
  var c = calc(), A = E.cfg.ajustes, X = E.cfg.articulos;
  var nombres = []; X.botellas.forEach(function (b) { for (var i = 0; i < (E.bot[b.id] || 0); i++) nombres.push(b.nombre); });
  var slots = '';
  for (var i = 0; i < Math.max(c.botellasMin, nombres.length); i++) slots += '<span class="slot ' + (nombres[i] ? 'lleno' : '') + '">' + (nombres[i] ? esc(nombres[i]) : 'Botella ' + (i + 1) + ': elige una') + '</span>';
  $('#slots').innerHTML = slots;
  $('#l-bot').innerHTML = stepperItem(X.botellas, E.bot, 'bot', function (a) { return eur(a.precio); });
  $('#l-ref').innerHTML = stepperItem(X.refrescos, E.ref, 'ref', function (a) { return (a.suplemento > 0 ? '<em>+' + eur(a.suplemento) + ' suplemento</em> · ' : '') + 'extra ' + eur(a.precio); });
  if ($('#l-shi')) $('#l-shi').innerHTML = stepperItem(X.shishas, E.shi, 'shi', function (a) { return eur(a.precio); });
  var cupo = c.refrescos ? c.refrescos.cupo : 0, usados = c.refrescos ? c.refrescos.total : 0;
  $('#medidor').innerHTML = '<div class="lin"><span>Refrescos incluidos elegidos</span><span>' + usados + ' / ' + cupo + '</span></div><div class="medidor"><i style="width:' + (cupo ? Math.min(100, Math.round(usados * 100 / cupo)) : 0) + '%"></i></div>';
  $('#barra-total').textContent = eur(c.total);
  var falta = c.botellasMin - c.botellasSel;
  $('#cupo-txt').textContent = cupo;
  var faltaRef = c.refrescos && X.refrescos.length ? c.refrescos.cupo - c.refrescos.total : 0;
  $('#barra-msg').textContent = falta > 0 ? 'Elige ' + falta + (falta === 1 ? ' botella más' : ' botellas más') : faltaRef > 0 ? 'Elige ' + faltaRef + (faltaRef === 1 ? ' refresco más' : ' refrescos más') + ' de los incluidos' : '';
  $('#btn-pago').disabled = !c.ok;
}

/* ----- pago ----- */
function lineasHtml(c) {
  return c.lineas.map(function (l) { return '<div class="lin' + (l.incluido ? ' inc' : '') + '"><span>' + esc(l.txt) + '</span><span>' + (l.incluido ? 'incl.' : eur(l.importe)) + '</span></div>'; }).join('');
}
function copiarBtn(txt) { return '<button class="btn sm" type="button" data-a="copiar" data-v="' + esc(txt) + '">Copiar</button>'; }
function vistaPago() {
  var c = calc(), A = E.cfg.ajustes, entrada = E.modo === 'entrada';
  var cabeza = entrada
    ? '<button class="volver" type="button" data-a="a-opciones">← Volver</button>' +
      '<section class="card"><h2>' + esc(A.entradaTitulo) + '</h2>' + (A.entradaDesc ? '<p class="hint">' + esc(A.entradaDesc) + '</p>' : '') +
      '<div class="item"><div class="nom">Número de entradas<div class="pre">' + eur(A.entradaPrecio) + ' cada una</div></div><div class="stepper"><button type="button" data-a="cant" data-d="-1" aria-label="Una entrada menos"' + (E.cantidad <= 1 ? ' disabled' : '') + '>−</button><output id="cant">' + E.cantidad + '</output><button type="button" data-a="cant" data-d="1" aria-label="Una entrada más">+</button></div></div></section>'
    : '<button class="volver" type="button" data-a="a-botellas">← Volver</button>';
  return '<div class="stack">' + cabeza +
    '<section class="card"><h2>Tu pedido</h2>' +
    (entrada ? '' : '<div class="lista">' + E.mesas.map(function (x) { return '<div class="lin"><span>' + esc(Shared.nombreMesa(x.id)) + '</span><span>' + x.personas + ' pers.</span></div>'; }).join('') + '</div><hr class="sep">') +
    '<div id="lineas">' + lineasHtml(c) + '</div><hr class="sep"><div class="total"><span>Total a pagar</span><span id="pago-total">' + eur(c.total) + '</span></div></section>' +
    '<section class="card"><h2>Tus datos</h2><div class="campos dos">' +
    '<label class="campo"><span>Nombre</span><input id="nombre" type="text" autocomplete="name" placeholder="Tu nombre" value="' + esc(E.nombre) + '"></label>' +
    '<label class="campo"><span>Teléfono</span><input id="telefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="612 345 678" value="' + esc(E.telefono) + '"></label></div></section>' +
    '<section class="card"><h2>Paga por transferencia o Bizum</h2><p class="hint">Haz el pago de <b id="pago-total2">' + eur(c.total) + '</b> y adjunta el comprobante abajo.</p>' +
    (A.iban ? '<div class="dato"><div><small>Transferencia · Nombre</small><b>' + esc(A.titular) + '</b></div></div><div class="dato"><div><small>IBAN</small><b>' + esc(A.iban) + '</b></div>' + copiarBtn(A.iban) + '</div>' : '') +
    (A.bizum ? '<div class="dato"><div><small>Bizum · Teléfono</small><b>' + esc(A.bizum) + '</b></div>' + copiarBtn(A.bizum) + '</div>' : '') +
    (!A.iban && !A.bizum ? '<div class="aviso">El local aún no ha configurado sus datos de pago.</div>' : '') +
    '<p class="nota">En el concepto o mensaje pon tu nombre y la fecha del evento.</p></section>' +
    '<section class="card"><h2>Comprobante de pago</h2><p class="hint">Foto o captura de la transferencia o del Bizum, o un PDF. Hasta ' + MAXARCH + ' archivos.</p>' +
    '<div class="archivos" id="archivos"></div>' +
    '<label class="btn block" for="archivo-in" id="lbl-arch">Adjuntar imagen o PDF</label>' +
    '<input id="archivo-in" class="sr" type="file" accept="image/*,application/pdf" multiple></section>' +
    '<div id="err-envio"></div>' +
    '<div class="barra"><div class="m" id="pago-msg" style="color:var(--warn)"></div><button class="btn primary" type="button" id="btn-enviar" data-a="enviar">Enviar reserva por WhatsApp</button></div></div>';
}
function listaArchivos() {
  var d = $('#archivos'); if (!d) return;
  d.innerHTML = E.archivos.map(function (a, i) { return '<div class="archivo"><span>' + esc(a.nombre) + '</span><button class="btn sm danger" type="button" data-a="quitar-arch" data-i="' + i + '">Quitar</button></div>'; }).join('');
  var l = $('#lbl-arch'); if (l) l.style.display = E.archivos.length >= MAXARCH ? 'none' : '';
}
function faltaPago() {
  var f = [], c = calc(), A = E.cfg.ajustes;
  if (!c.ok) f.push(c.errores[0]);
  if (E.nombre.trim().length < 2) f.push('tu nombre');
  if (tel(E.telefono).length < 10) f.push('un teléfono válido');
  if (!E.archivos.length) f.push('el comprobante de pago');
  if (tel(A.whatsapp).length < 10) return ['__sinwa'];
  return f;
}
function pintarPagoEstado() {
  var f = faltaPago(), b = $('#btn-enviar'), m = $('#pago-msg'); if (!b) return;
  b.disabled = !!f.length || E.enviando;
  m.textContent = f[0] === '__sinwa' ? 'Las reservas online no están activas todavía.' : f.length ? 'Falta: ' + f.join(', ') + '.' : '';
}
function pintarEntradaPago() {
  var c = calc(); $('#pago-total').textContent = eur(c.total); $('#pago-total2').textContent = eur(c.total);
  $('#lineas').innerHTML = lineasHtml(c); $('#cant').textContent = E.cantidad;
  $$('[data-a="cant"]').forEach(function (b) { if (b.dataset.d === '-1') b.disabled = E.cantidad <= 1; });
  pintarPagoEstado();
}

function vistaEnviado() {
  var r = E.resultado;
  return '<div class="stack"><section class="card"><h1>Falta un último paso</h1>' +
    '<p>Tu reserva y tu comprobante ya están guardados. Ahora abre WhatsApp y <b>pulsa Enviar</b> para avisar al local. Si no se ha abierto solo, usa el botón.</p>' +
    '<div><div class="hint">Código de tu reserva</div><div class="codigo">' + esc(r.codigo) + '</div></div>' +
    '<a class="btn primary block" target="_blank" rel="noopener" href="' + esc(r.url) + '">Abrir WhatsApp otra vez</a></section>' +
    '<section class="card"><h2>Qué pasa ahora</h2><ol class="pasos-lista">' +
    '<li><div><b>El local revisa tu pago</b><span>Comprueba tu comprobante y valida la reserva.</span></div></li>' +
    '<li><div><b>Recibes la respuesta por WhatsApp</b><span>Te escribimos al ' + esc(r.telefono) + ' para confirmar tu reserva o decirte si hay algún problema.</span></div></li></ol></section>' +
    '<button class="btn" type="button" data-a="nueva">Hacer otra reserva</button></div>';
}

/* ---------- render ---------- */
function render() {
  var h = cabecera();
  if (E.etapa === 'enviado') { app.innerHTML = h + vistaEnviado(); window.scrollTo(0, 0); return; }
  h += pasosHtml();
  h += '<div class="stack">' + seccionFecha();
  if (E.fecha && !E.editFecha) {
    if (E.etapa === 'opciones') h += seccionOpciones();
    else if (E.etapa === 'plano') h += vistaPlano();
    else if (E.etapa === 'botellas') h += vistaBotellas();
    else if (E.etapa === 'pago') h += vistaPago();
  }
  h += '</div><p class="pie">Malamia · Discoteca en el sur de Tenerife</p>';
  app.innerHTML = h;
  if (E.etapa === 'botellas') pintarBotellas();
  if (E.etapa === 'pago') { listaArchivos(); pintarPagoEstado(); }
}
function ir(etapa) { E.etapa = etapa; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); if (etapa === 'plano') refrescarDisp(); }

/* ---------- archivos ---------- */
function comprimir(file) {
  return new Promise(function (res, rej) {
    var lector = new FileReader();
    lector.onerror = function () { rej(new Error('No se pudo leer el archivo.')); };
    lector.onload = function () {
      var url = lector.result;
      if (file.type === 'application/pdf') {
        if (file.size > 6 * 1024 * 1024) return rej(new Error('El PDF pesa demasiado (máximo 6 MB).'));
        return res({ nombre: file.name, datos: url.split(',')[1] });
      }
      var img = new Image();
      img.onerror = function () { rej(new Error('Esa imagen no se puede usar. Prueba con JPG o PNG.')); };
      img.onload = function () {
        var max = 1800, k = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
        res({ nombre: (file.name || 'comprobante').replace(/\.[^.]+$/, '') + '.jpg', datos: cv.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      img.src = url;
    };
    lector.readAsDataURL(file);
  });
}

function enviar() {
  if (E.enviando || faltaPago().length) return;
  E.enviando = true; var b = $('#btn-enviar'); b.disabled = true; b.textContent = 'Enviando…'; $('#err-envio').innerHTML = '';
  api('/api/reservas', { method: 'POST', body: { pedido: pedido(), nombre: E.nombre.trim(), telefono: E.telefono.trim(), token: TOKEN, comprobantes: E.archivos } })
    .then(function (r) {
      var url = 'https://wa.me/' + tel(E.cfg.ajustes.whatsapp) + '?text=' + encodeURIComponent(r.mensaje);
      E.resultado = { codigo: r.codigo, url: url, telefono: E.telefono.trim() };
      E.etapa = 'enviado'; E.enviando = false; render();
      try { window.open(url, '_blank', 'noopener'); } catch (x) { /* el botón de la pantalla lo abre */ }
    })
    .catch(function (e) {
      E.enviando = false;
      var b2 = $('#btn-enviar'); if (b2) b2.textContent = 'Enviar reserva por WhatsApp';
      if (e.status === 409 && E.modo === 'reservado') {
        cargar(E.fecha).then(function () { return refrescarDisp(); }).then(function () { quitarOcupadas(); E.etapa = 'plano'; render(); toast(e.message); });
        return;
      }
      var d = $('#err-envio'); if (d) d.innerHTML = '<div class="aviso mal">' + esc(e.status ? e.message : 'No hay conexión. Inténtalo de nuevo.') + '</div>';
      pintarPagoEstado();
    });
}

/* ---------- eventos ---------- */
app.addEventListener('click', function (ev) { var el = ev.target.closest('[data-a]'); if (el) accion(el, ev); });
document.getElementById('sheet').addEventListener('click', function (ev) { var el = ev.target.closest('[data-a]'); if (el) accion(el, ev); });
app.addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('g.mesa[data-a]')) { ev.preventDefault(); accion(ev.target, ev); } });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && E.sheet) { E.sheet = null; pintarSheet(); } });

function accion(el, ev) {
  var a = el.dataset.a;
  if (a === 'mes') { var n = new Date(E.mes.y, E.mes.m + Number(el.dataset.d), 1); E.mes = { y: n.getFullYear(), m: n.getMonth() }; render(); return; }
  if (a === 'dia') {
    var f = el.dataset.f;
    if (f !== E.fecha) {
      var vieja = E.fecha;
      if (vieja && E.mesas.length) navigator.sendBeacon && navigator.sendBeacon('/api/retener', new Blob([JSON.stringify({ fecha: vieja, token: TOKEN, mesas: [] })], { type: 'application/json' }));
      E.fecha = f; E.mesas = []; E.bot = {}; E.ref = {}; E.shi = {}; E.modo = null;
    }
    E.editFecha = false; E.etapa = 'opciones';
    cargar(f).then(render).catch(function () { toast('No se pudo cargar la fecha. Inténtalo de nuevo.'); E.editFecha = true; render(); });
    return;
  }
  if (a === 'cambiar-fecha') { E.editFecha = true; var p = parseISO(E.fecha); E.mes = { y: p.getFullYear(), m: p.getMonth() }; render(); return; }
  if (a === 'modo-entrada') { E.modo = 'entrada'; E.cantidad = 1; ir('pago'); return; }
  if (a === 'modo-reservado') {
    E.modo = 'reservado'; cargar(E.fecha).then(function () { return refrescarDisp(); }).then(function () { ir('plano'); }).catch(function () { toast('No se pudo cargar el plano. Inténtalo de nuevo.'); });
    return;
  }
  if (a === 'a-opciones') { E.modo = null; ir('opciones'); return; }
  if (a === 'a-plano') { ir('plano'); return; }
  if (a === 'a-botellas') { ir('botellas'); return; }
  if (a === 'a-pago') { if (calc().ok) ir('pago'); return; }
  if (a === 'mesa') {
    var id = el.dataset.id, ex = E.mesas.filter(function (x) { return x.id === id; })[0];
    E.sheet = { id: id, personas: ex ? ex.personas : minDe(id) }; pintarSheet(); return;
  }
  if (a === 'cerrar-sheet') { E.sheet = null; pintarSheet(); return; }
  if (a === 'pers') {
    var s = E.sheet; s.personas = Math.max(minDe(s.id), Math.min(maxDe(s.id), s.personas + Number(el.dataset.d))); pintarSheet(); return;
  }
  if (a === 'guardar-mesa') {
    var sh = E.sheet, prev = E.mesas.slice(), ya = E.mesas.filter(function (x) { return x.id === sh.id; })[0];
    if (ya) ya.personas = sh.personas; else E.mesas.push({ id: sh.id, personas: sh.personas });
    E.sheet = null; pintarSheet(); pintarPlano();
    retener().then(pintarPlano).catch(function (e) {
      if (e.status === 409) { E.mesas = prev; toast('Esa mesa acaba de ser reservada por otra persona.'); pintarPlano(); }
      else toast('No se pudo reservar la mesa. Revisa tu conexión.');
    });
    return;
  }
  if (a === 'quitar-mesa') { E.mesas = E.mesas.filter(function (x) { return x.id !== el.dataset.id; }); pintarPlano(); retener().then(pintarPlano).catch(function () {}); return; }
  if (a === 'q') {
    var mapa = { bot: E.bot, ref: E.ref, shi: E.shi }[el.dataset.k], id2 = el.dataset.id;
    mapa[id2] = Math.max(0, Math.min(99, (mapa[id2] || 0) + Number(el.dataset.d))); pintarBotellas(); return;
  }
  if (a === 'cant') { E.cantidad = Math.max(1, Math.min(30, E.cantidad + Number(el.dataset.d))); pintarEntradaPago(); return; }
  if (a === 'copiar') {
    var v = el.dataset.v;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { toast('Copiado'); }, function () {
      var t = document.createElement('textarea'); t.value = v; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Copiado'); } catch (e) { toast('Selecciona el texto y cópialo'); } t.remove();
    });
    return;
  }
  if (a === 'quitar-arch') { E.archivos.splice(Number(el.dataset.i), 1); listaArchivos(); pintarPagoEstado(); return; }
  if (a === 'enviar') { enviar(); return; }
  if (a === 'nueva') { var fch = E.fecha; E.mesas = []; E.bot = {}; E.ref = {}; E.shi = {}; E.archivos = []; E.modo = null; E.resultado = null; E.editFecha = true; E.fecha = ''; E.etapa = 'fecha'; cargar().then(render); return; }
}
app.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'nombre') { E.nombre = t.value; pintarPagoEstado(); }
  else if (t.id === 'telefono') { E.telefono = t.value; pintarPagoEstado(); }
});
app.addEventListener('change', function (ev) {
  var t = ev.target; if (t.id !== 'archivo-in') return;
  var files = Array.prototype.slice.call(t.files || []); t.value = '';
  files.slice(0, MAXARCH - E.archivos.length).reduce(function (p, f) {
    return p.then(function () { return comprimir(f).then(function (x) { E.archivos.push(x); listaArchivos(); pintarPagoEstado(); }, function (e) { toast(e.message); }); });
  }, Promise.resolve());
});

/* actualización continua: plano cada 5 s y mantener las mesas retenidas mientras se completa la reserva */
setInterval(function () { if (E.etapa === 'plano' && !E.sheet && !document.hidden) refrescarDisp(); }, 5000);
setInterval(function () { if (E.modo === 'reservado' && E.mesas.length && E.etapa !== 'enviado' && !document.hidden) retener().then(function () { var q = quitarOcupadas(); if (q) { toast('Una de tus mesas acaba de ser reservada por otra persona.'); E.etapa = 'plano'; render(); } }).catch(function (e) { if (e.status === 409) { quitarOcupadas(); toast('Una de tus mesas acaba de ser reservada por otra persona.'); E.etapa = 'plano'; render(); } }); }, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden && E.etapa === 'plano') refrescarDisp(); });
window.addEventListener('pagehide', function () {
  if (E.fecha && E.modo === 'reservado' && E.mesas.length && E.etapa !== 'enviado' && navigator.sendBeacon) navigator.sendBeacon('/api/retener', new Blob([JSON.stringify({ fecha: E.fecha, token: TOKEN, mesas: [] })], { type: 'application/json' }));
});

cargar().then(render).catch(function () { app.innerHTML = cabecera() + '<p class="cargando">No se pudo cargar la página. Revisa tu conexión y recarga.</p>'; });
})();
</script>
